{% load static%}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="{% static 'toDoListApp/css/style.css'%}">
    <title>register Task</title>
</head>
<body>
    
    <main>

        <form action="{% url 'registerTask' %}" method="POST" id="formulario">
            {% csrf_token %} 
            
            <div>
                <label for="formGroupExampleInput" class="form-label" style="color: aliceblue;">NOME TAREFA</label>
                <input class="form-control" type="text" placeholder="Digite o nome da Tarefa" name="nameTask" aria-label="Disabled input example" >
            </div>
        <div>
            <label for="formGroupExampleInput" class="form-label" style="color: aliceblue;">DESCRIÇÃO</label>
            <textarea class="form-control" id="exampleFormControlTextarea1" name="description" rows="4" placeholder="Digite a descrição da tarefa"></textarea>
        </div> 
        
        <button  class="btn btn-success" style="background-color: blueviolet;" type="submit">Success</button>
        <a href="{% url 'viewTasks' %}" class="btn btn-success" style="background-color: rgb(48, 146, 105);">Visualizar tarefas</a>

    </form>
</main>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
