<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Site{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Meu Site</h1>
        <nav>
            <a href="/">Home</a> |
            <a href="/sobre/">Sobre</a> |
            <a href="/contato/">Contato</a>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- O conteúdo das páginas filhas será colocado aqui -->
        {% endblock %}
    </main>

    <footer>
        <p>© 2025 Meu Site</p>
    </footer>

</body>
</html>
